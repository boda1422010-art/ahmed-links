<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوله يجدع</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;
font-family:'Cairo',sans-serif;
background: #e9d5ff;
background-image: 
radial-gradient(ellipse at 20% 30%, rgba(251,207,232,0.9) 0%, transparent 50%),
radial-gradient(ellipse at 80% 20%, rgba(216,180,254,0.8) 0%, transparent 50%),
radial-gradient(ellipse at 50% 80%, rgba(240,171,252,0.7) 0%, transparent 60%),
url('https://images.unsplash.com/photo-1534088568595-a066f410bcda?q=80&w=1200');
background-size:cover;
background-position:center;
background-blend-mode: overlay;
}
.wrap{width:100%;max-width:440px;position:relative}
h1{
font-size:62px;font-weight:800;color:#b07acb;line-height:1;
text-align:center;
-webkit-text-stroke:3px white;
text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 40px rgba(176,122,203,0.4);
filter: drop-shadow(0 2px 0 white) drop-shadow(0 0 15px rgba(255,255,255,0.8));
margin-bottom:12px;
letter-spacing:1px;
}
.sub{text-align:center;color:#9a6ab6;font-size:14px;font-weight:700;margin-bottom:20px;text-shadow:0 1px 0 white}
.bubbles{display:flex;justify-content:center;gap:14px;margin-bottom:28px}
.bubble{
width:62px;height:62px;border-radius:50%;
background:rgba(255,255,255,0.45);backdrop-filter:blur(10px);
border:1.5px solid rgba(255,255,255,0.9);
display:flex;align-items:center;justify-content:center;
font-size:28px;box-shadow:0 5px 20px rgba(0,0,0,0.08), inset 0 2px 0 rgba(255,255,255,0.9)
}
.links{display:flex;flex-direction:column;gap:18px}
.card{
display:flex;align-items:center;gap:16px;padding:14px 20px;
background:linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0.38));
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
border-radius:22px;border:1.8px solid rgba(255,255,255,0.85);
box-shadow: 0 10px 30px rgba(176,122,203,0.18), inset 0 1px 0 rgba(255,255,255,1), inset 0 -1px 0 rgba(255,255,255,0.5);
text-decoration:none;color:#111;position:relative;overflow:hidden;
transition:0.3s;
}
.card::after{
content:'✦';position:absolute;right:18px;top:12px;font-size:14px;color:rgba(255,255,255,0.9);text-shadow:0 0 8px white
}
.card:hover{transform:translateY(-2px) scale(1.01);background:rgba(255,255,255,0.65)}
.card-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.card b{font-size:20px;line-height:1.1;display:block;color:#111}
.card span{font-size:15px;color:#333;font-weight:600}
.foot{
margin:28px auto 0;
background:rgba(255,255,255,0.5);backdrop-filter:blur(12px);
border:1.5px solid rgba(255,255,255,0.8);
padding:10px 18px;border-radius:40px;
text-align:center;font-size:13px;color:#7a5a9a;width:fit-content;
box-shadow:0 4px 15px rgba(0,0,0,0.05)
}
/* فراشات ونجوم زي الصورة */
.deco{position:absolute;pointer-events:none;font-size:18px;opacity:0.9}
</style>
</head>
<body>
<div class="wrap">
<h1>لوله يجدع</h1>
<div class="sub">✨ Content Creator • Lifestyle • Pink Dreams ✨</div>
<div class="bubbles">
<div class="bubble">🦋</div>
<div class="bubble">🌸</div>
<div class="bubble">✨</div>
</div>

<div class="links">
<a class="card" href="https://www.instagram.com/lwlwyjd">
<div class="card-icon">📸</div>
<div><b>Instagram</b><span>@lwlwyjd</span></div>
</a>

<a class="card" href="https://www.tiktok.com/@.a32424">
<div class="card-icon">🎵</div>
<div><b>TikTok</b><span>@.a32424</span></div>
</a>

<a class="card" href="https://wa.me/201210435638">
<div class="card-icon" style="background:rgba(196,181,253,0.4)">▶️</div>
<div><b>YouTube</b><span>WhatsApp 01210435638</span></div>
</a>

<a class="card" href="https://www.instagram.com/lwlwyjd">
<div class="card-icon">🛍️</div>
<div><b>Shop My Favorites</b><span>Amazon Storefront</span></div>
</a>
</div>

<div class="foot">✨ Just a girl living in pastel clouds ✨</div>

<span class="deco" style="left:-10px;bottom:120px;font-size:32px">🦋</span>
<span class="deco" style="right:-5px;bottom:80px;font-size:30px">🦋</span>
<span class="deco" style="left:10px;top:50%;font-size:14px">🌸</span>
</div>
</body>
</html>
