<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed Links</title>
<style>
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background: linear-gradient(135deg,#fff8e7,#fff);
  font-family: sans-serif;
}
.card{
  width:90%;max-width:380px;background:rgba(255,255,255,0.7);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-radius:30px; padding:30px; text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.1); border:1px solid rgba(255,255,255,0.8);
}
.avatar{width:90px;height:90px;border-radius:50%;margin:0 auto 15px;background:linear-gradient(45deg,#ffd26f,#ff9a3d);}
h1{margin:10px 0 5px;font-size:24px}
p{color:#888;margin:0 0 20px}
a.link{
  display:block;background:rgba(255,255,255,0.9);margin:12px 0;padding:14px;
  border-radius:15px;text-decoration:none;color:#333;font-weight:bold;
  border:1px solid #eee; transition:0.2s;
}
a.link:hover{transform:scale(1.03);background:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="avatar"></div>
  <h1>Ahmed</h1>
  <p>Golden Hour Links ✨</p>
  
  <a class="link" href="https://tiktok.com/@..." target="_blank">TikTok 🎵</a>
  <a class="link" href="https://instagram.com/..." target="_blank">Instagram 📸</a>
  <a class="link" href="https://wa.me/..." target="_blank">WhatsApp 💬</a>
</div>
</body>
</html>
