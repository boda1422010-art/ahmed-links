<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;
background: radial-gradient(circle at 30% 20%, #fbcfe8 0%, #e9d5ff 25%, #d8b4fe 40%, #f0abfc 65%, #c4b5fd 100%),
url('https://images.unsplash.com/photo-1534088568595-a066f410bcda?q=80&w=1000') center/cover;
background-blend-mode: overlay;
font-family: 'Cairo', system-ui;
}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.1),rgba(196,181,253,0.3));pointer-events:none}
.card{position:relative;width:100%;max-width:420px;text-align:center;z-index:1}
h1{
font-family:'Fredoka','Cairo',sans-serif;font-size:58px;color:#a87ac2;
text-shadow:0 0 0 #fff, 0 2px 0 #fff, 0 0 15px rgba(255,255,255,0.9), 0 0 25px rgba(168,122,194,0.5);
-webkit-text-stroke: 2px #fff;
line-height:1.1;margin-bottom:10px;
}
.subtitle{color:#8b5fb3;font-size:15px;margin-bottom:22px;letter-spacing:0.5px;text-shadow:0 1px 0 #fff}
.icons{display:flex;gap:12px;justify-content:center;margin-bottom:28px}
.icon{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.5);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,0.8);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 15px rgba(168,122,194,0.2)}
.links{display:flex;flex-direction:column;gap:16px}
.link{
display:flex;align-items:center;gap:16px;padding:16px 20px;
background:rgba(255,255,255,0.42);backdrop-filter:blur(18px);
border-radius:20px;border:1.5px solid rgba(255,255,255,0.7);
text-decoration:none;color:#1f1f1f;text-align:left;
box-shadow:0 8px 32px rgba(168,122,194,0.15), inset 0 1px 0 rgba(255,255,255,0.9);
transition:all 0.3s ease;
}
.link:hover{transform:translateY(-3px) scale(1.02);background:rgba(255,255,255,0.6);box-shadow:0 12px 40px rgba(168,122,194,0.25)}
.link-icon{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.link-text{line-height:1.2}
.link-text b{font-size:20px;display:block;color:#111}
.link-text span{font-size:15px;color:#444;font-weight:600}
.footer{margin-top:26px;background:rgba(255,255,255,0.45);backdrop-filter:blur(12px);padding:10px 18px;border-radius:50px;display:inline-block;border:1px solid rgba(255,255,255,0.7);font-size:13px;color:#7a5a8a}
</style>
</head>
